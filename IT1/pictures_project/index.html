<!DOCTYPE html>
<head>
  <title>Pictures</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="media/favicon.ico">
  <script src="script.js"></script>
</head>

<body>
  <h1>Pictures</h1>
  <div class="container">

    <div class="clickable" id="L" onclick="left()">
      <img src="media/left_arrow.png" alt="left_arrow"> 
    </div>

    <div class="display">
      <img id="photo" src="media/square.png" alt="square"> 
    </div>

    <div class="clickable" id="R" onclick="right()">
      <img src="media/right_arrow.png" alt="right_arrow">
    </div>

  </div>
</body>
