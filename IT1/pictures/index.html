<!DOCTYPE html>
<head>
<title>Pictures</title>
</head>

<body>
  <h1>Pictures</h1>
  <div class="container">

    <div class="clickable" id="L" onclick="left()">
      <img src="media/left_arrow.png"> 
    </div>
    <div class="display">
      <img id="photo" src="media/square.png"> 
    </div>
    <div class="clickable" id="R" onclick="right()">
      <img src="media/right_arrow.png">
    </div>

  </div>

  <style>
    .container {
      display: flex;
      justify-content: space-between;
      border-color: blue;
    }
    .clickable {
      cursor: pointer;
      min-width: 10vh;
      min-height: 10vh;
    }
    .display {
      min-height: 10vh;
      min-width: 10vh;
    }
  </style>

<script>
  const former = [
      "square",
      "triangle",
      "arrow",
      "circle",
      "cross",
      "heart",
      "hexagon",
      "pentagon",
      "rombus",
      "star"
    ];
  let left_button = document.getElementById("L");
  let right_button = document.getElementById("R");
  let display = document.querySelector(".display");
  let current = 0;

  function update_alt(){
    photo.alt = former[current]
  }

  function show_photo() {
    //photo.src = former[current];
    photo.src = `media/${former[current]}.png`;
    update_alt();
  }

  function left() {
      if (current < 0) {
        current = former.length - 1;
      }
      current--;
      show_photo();
    }
  function right() {
    if (current >= former.length) {
      current = 0;
    }
    current++;
    show_photo();
  }
</script>

</body>
